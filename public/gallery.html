<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Character Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main id="app" class="gallery">
    <div class="topbar">
      <h2 class="display">🎭 <span id="title"></span></h2>
      <span class="muted" id="count"></span>
      <span class="spacer"></span>
      <span id="langSlot"></span>
      <a class="btn ghost small" href="/" id="back"></a>
    </div>
    <div class="panel stack" style="margin-bottom:16px">
      <input type="text" id="q">
      <div class="chips" id="cats"></div>
    </div>
    <div class="cards" id="cards"></div>
  </main>
  <script src="/i18n.js"></script>
  <script>
    const { t, L } = window.i18n;
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    let all = [], cat = '';

    function chrome() {
      document.title = t('gallery.title');
      document.getElementById('title').textContent = t('gallery.title');
      document.getElementById('back').textContent = t('gallery.back');
      document.getElementById('q').placeholder = t('gallery.search');
      document.getElementById('langSlot').innerHTML = window.i18n.picker();
      document.getElementById('langPick').onchange = (e) => window.i18n.setLang(e.target.value);
      const cats = [...new Map(all.map((c) => [c.cat, c.catLabel])).entries()];
      const box = document.getElementById('cats');
      box.innerHTML = `<label class="chip ${cat ? '' : 'on'}" data-c="">${t('gallery.all')}</label>` +
        cats.map(([id, l]) => `<label class="chip ${cat === id ? 'on' : ''}" data-c="${id}">${esc(L(l))}</label>`).join('');
      box.onclick = (e) => { const el = e.target.closest('[data-c]'); if (!el) return; cat = el.dataset.c; chrome(); draw(); };
    }

    function draw() {
      const q = document.getElementById('q').value.toLowerCase().trim();
      // Search matches both languages.
      const text = (c) => [c.name.en, c.name.es, c.from.en, c.from.es, ...c.traits.flatMap((x) => [x.en, x.es])].join(' ').toLowerCase();
      const list = all.filter((c) => (!cat || c.cat === cat) && (!q || text(c).includes(q)));
      document.getElementById('count').textContent = t('gallery.count', { n: list.length, missing: all.filter((c) => !c.img).length });
      document.getElementById('cards').innerHTML = list.map((c) => `
        <article class="card">
          <div class="pic">${c.img ? `<img src="${esc(c.img)}" loading="lazy" referrerpolicy="no-referrer" alt="">` : `<div class="ph" style="background:#8a7fb0">?</div>`}</div>
          <div class="meta"><div class="name">${esc(L(c.name))}</div><div class="from">${esc(L(c.from))}</div></div>
          <div class="traits">${c.traits.map((x) => esc(L(x))).join(' · ')}</div>
        </article>`).join('');
    }

    window.i18n.onChange(() => { chrome(); draw(); });
    document.getElementById('q').oninput = draw;
    chrome();
    fetch('/api/gallery').then((r) => r.json()).then((d) => { all = d; chrome(); draw(); });
  </script>
</body>
</html>
